<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>PDF 下载示例</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: #f7f4ee;
      color: #1c2420;
    }
    main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
    h1 { font-size: 32px; margin-bottom: 8px; }
    p { line-height: 1.6; }
    a, button {
      display: inline-flex;
      align-items: center;
      margin: 8px 8px 0 0;
      padding: 10px 14px;
      border-radius: 999px;
      background: #1c4034;
      color: white;
      text-decoration: none;
      border: 0;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>PDF 下载示例</h1>
    <p>用下面几个入口确认：网页里触发的 PDF 都会进右侧列表，然后再另存为。</p>
    <p>
      <a href="./sample.pdf" download="示例报告.pdf">下载 PDF 文件</a>
      <a href="./sample.pdf">在页面中打开 PDF</a>
      <button id="blob" type="button">用脚本下载</button>
      <button id="two" type="button">一次下载两个</button>
    </p>
  </main>
  <script>
    async function pdfBlob() {
      const response = await fetch('./sample.pdf');
      const bytes = await response.arrayBuffer();
      return new Blob([bytes], { type: 'application/pdf' });
    }

    function saveBlob(blob, filename) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    document.getElementById('blob').addEventListener('click', async () => {
      saveBlob(await pdfBlob(), '脚本下载.pdf');
    });

    document.getElementById('two').addEventListener('click', async () => {
      const blob = await pdfBlob();
      saveBlob(blob, '第一份.pdf');
      saveBlob(blob, '第二份.pdf');
    });
  </script>
</body>
</html>
